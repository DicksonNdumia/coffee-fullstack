<app-spinner></app-spinner>

<div class="meeting-container">
  <header class="meeting-header">
    <div class="header-content">
      <h1>Upcoming Meetings</h1>
      <button class="btn-add-meeting">+ Add Meeting</button>
    </div>
  </header>

  <section class="meeting-grid">
    @for (item of meetingList; track item.id || $index) {
      <div class="meeting-card">
        <div class="card-badge">#{{ $index + 1 }}</div>

        <h2 class="meeting-title">{{ item.title }}</h2>

        <div class="card-info">
          <p class="meeting-description">
            <strong>Description:</strong> {{ item.description }}
          </p>
          <p class="meeting-attendance">
            <strong>Attendees:</strong> {{ item.attendance }}
          </p>
        </div>

        <div class="card-actions">
          <button class="btn-update">Update</button>
          <button class="btn-delete">Delete</button>
        </div>
      </div>
    } @empty {
      <div class="empty-state">
        <p>No meetings scheduled. Time to brew some ideas!</p>
      </div>
    }
  </section>
</div>
