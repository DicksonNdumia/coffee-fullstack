@if (isLoginView) {
  <form class="login-page">
    <header class="login-header">
      <h1>Welcome Back to Coffee Website</h1>
    </header>

    <div class="login-container">
      <div class="input-group">
        <label for="email-field" class="email-label">UserName</label>
        <input
          name="userName"
          [(ngModel)]="userLogin.email"
          id="email-field"
          class="email-input"
          placeholder="enter your Email"
          type="email"
          required
        />
      </div>

      <div class="input-group">
        <label for="password-field" class="password-label">Password</label>
        <input
          name="password"
          [(ngModel)]="userLogin.password"
          id="password-field"
          class="password-input"
          placeholder="••••••••"
          type="password"
          required
        />
      </div>

      <button type="submit" class="btn" (click)="onLogin()">Sign In</button>
      <p>
        Don't have an account<a class="link-info" (click)="isLoginView = false">Register Here</a>
      </p>
    </div>
  </form>
} @else {
  <form class="login-page">
    <header class="login-header">
      <h1>New Here! Welcome to Coffee Website</h1>
    </header>

    <div class="login-container">
      <div class="input-group">
        <label for="email-field" class="email-label">name</label>
        <input
          name="userName"
          [(ngModel)]="userRegisterObj.name"
          id="email-field"
          class="email-input"
          placeholder="enter your user name"
          type="text"
          required
        />
      </div>

      <div class="input-group">
        <label for="email-field" class="email-label">Location</label>
        <input
          name="location"
          [(ngModel)]="userRegisterObj.location"
          id="email-field"
          class="email-input"
          placeholder="enter your Location"
          type="text"
          required
        />
      </div>

      <div class="input-group">
        <label for="email-field" class="email-label">County</label>
        <input
          name="county"
          [(ngModel)]="userRegisterObj.county"
          id="email-field"
          class="email-input"
          placeholder="enter your Home County"
          type="text"
          required
        />
      </div>

      <div class="input-group">
        <label for="email-field" class="email-label">Phone Number</label>
        <input
          name="phone_number"
          [(ngModel)]="userRegisterObj.phone_number"
          id="email-field"
          class="email-input"
          placeholder="enter your Phone number"
          type="tel"
          required
        />
      </div>

      <div class="input-group">
        <label for="email-field" class="email-label">Email</label>
        <input
          name="email"
          [(ngModel)]="userRegisterObj.email"
          id="email-field"
          class="email-input"
          placeholder="enter your user email"
          type="email"
          required
        />
      </div>

      <div class="input-group">
        <label for="email-field" class="email-label">password</label>
        <input
          name="password"
          [(ngModel)]="userRegisterObj.password"
          id="email-field"
          class="email-input"
          placeholder="enter Your password"
          type="password"
          required
        />
      </div>
      <div class="input-group">
        <label for="email-field" class="email-label">Date Of Birth</label>
        <input
          name="age"
          [(ngModel)]="userRegisterObj.age"
          id="email-field"
          class="email-input"
          placeholder="enter your Date of birt"
          type="date"
          required
        />
      </div>

      <div class="input-group">
        <label for="password-field" class="password-label">Select your Role</label>
        <select name="role_id" [(ngModel)]="userRegisterObj.role_id">

          <option>Select Role</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
        </select>
      </div>

      <!--      <button type="submit" class="btn">Sign In</button>-->
      <button class="btn" (click)="onRegister()">Create Account</button>
      <p>I have an account already<a class="link-info" (click)="isLoginView = true">Login</a></p>
    </div>
  </form>
}
